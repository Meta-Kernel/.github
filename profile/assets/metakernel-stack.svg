<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">MetaKernel high-level architecture</title>
<desc id="desc">A high-level non-enabling overview: MetaKernel, Workspace Runtime Infrastructure, Domain Kernels, and governed products.</desc>
<defs>
