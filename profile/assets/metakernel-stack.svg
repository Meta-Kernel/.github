  <text x="485" y="198" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Workspace Runtime</text>
  <text x="485" y="228" text-anchor="middle" fill="#a9d8d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">operating boundaries · execution</text>
  <text x="485" y="250" text-anchor="middle" fill="#a9d8d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">people · agents · devices · data</text>

  <rect x="660" y="155" width="220" height="120" rx="18" fill="#2d2440" stroke="#735aa4"/>
