  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="70" y="70" fill="#dcecff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">MetaKernel</text>
<text x="70" y="105" fill="#88a6c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Governed infrastructure for digital, agentic and physical systems</text>

<g filter="url(#shadow)">
