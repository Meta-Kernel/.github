<rect x="70" y="330" width="1060" height="120" rx="18" fill="#0b1824" stroke="#27445f"/>
<text x="95" y="365" fill="#dcecff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">PUBLIC PRINCIPLES</text>
<text x="95" y="400" fill="#9fb6ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">provider-neutral · versioned contracts · explicit governance · fail-closed controls · evidence &amp; provenance · portable deployment</text>
<text x="95" y="427" fill="#718aa0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">This diagram intentionally stays high-level and does not disclose proprietary implementation sequences or algorithms.</text>
