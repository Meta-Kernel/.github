<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MetaKernel governance overview"><rect width="1200" height="300" rx="28" fill="#071019"/><text x="60" y="62" fill="#f4f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">Governance is explicit</text><text x="60" y="92" fill="#8da5b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">Public overview — implementation details remain in controlled repositories</text><g font-family="Inter,Segoe UI,sans-serif"><rect x="60" y="132" width="240" height="92" rx="18" fill="#0f1d2b" stroke="#2d587d"/><text x="180" y="170" text-anchor="middle" fill="#7ec2ff" font-size="19" font-weight="700">Contracts</text><text x="180" y="197" text-anchor="middle" fill="#c6d5df" font-size="14">typed · versioned · machine-readable</text><rect x="340" y="132" width="240" height="92" rx="18" fill="#0f1d2b" stroke="#2d587d"/><text x="460" y="170" text-anchor="middle" fill="#7ec2ff" font-size="19" font-weight="700">Policy &amp; Authority</text><text x="460" y="197" text-anchor="middle" fill="#c6d5df" font-size="14">explicit boundaries · fail-closed</text><rect x="620" y="132" width="240" height="92" rx="18" fill="#0f1d2b" stroke="#2d587d"/><text x="740" y="170" text-anchor="middle" fill="#7ec2ff" font-size="19" font-weight="700">Evidence</text><text x="740" y="197" text-anchor="middle" fill="#c6d5df" font-size="14">provenance · lineage · auditability</text><rect x="900" y="132" width="240" height="92" rx="18" fill="#0f1d2b" stroke="#2d587d"/><text x="1020" y="170" text-anchor="middle" fill="#7ec2ff" font-size="19" font-weight="700">Providers</text><text x="1020" y="197" text-anchor="middle" fill="#c6d5df" font-size="14">replaceable · conformance-gated</text></g></svg>