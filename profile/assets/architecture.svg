  <rect x="740" y="160" width="195" height="230" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="768" y="207" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Domain Kernels</text>
  <text x="768" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Finance</text>
  <text x="768" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Healthcare</text>
  <text x="768" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Commerce · more</text>
  <rect x="768" y="340" width="123" height="30" rx="15" fill="#e2e8f0"/>
  <text x="785" y="361" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">domain packs</text>
</g>

<path d="M955 275 H1010" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<path d="M998 263 L1012 275 L998 287" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

