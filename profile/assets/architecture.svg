  <text x="1051" y="249" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#cbd5e1">Platforms</text>
  <text x="1051" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#cbd5e1">APIs</text>
