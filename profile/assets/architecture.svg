<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">MetaKernel architecture overview</title>
<desc id="desc">High-level MetaKernel product architecture from core infrastructure through workspace runtime and domain kernels to products.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#1f2937"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".16"/>
  </filter>
</defs>
<rect width="1200" height="520" rx="28" fill="#f8fafc"/>
<text x="60" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">MetaKernel · governed infrastructure stack</text>
<text x="60" y="106" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#475569">High-level public architecture — implementation details intentionally withheld.</text>

<g filter="url(#shadow)">
  <rect x="60" y="160" width="245" height="230" rx="24" fill="url(#g)"/>
  <text x="88" y="207" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">MetaKernel Core</text>
  <text x="88" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#cbd5e1">Contracts · governance</text>
  <text x="88" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#cbd5e1">Evidence · provider ports</text>
  <text x="88" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#cbd5e1">Portable runtime foundations</text>
  <rect x="88" y="340" width="155" height="30" rx="15" fill="#334155"/>
  <text x="105" y="361" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e2e8f0">provider-neutral</text>
</g>

<path d="M325 275 H380" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<path d="M368 263 L382 275 L368 287" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<g filter="url(#shadow)">
  <rect x="400" y="160" width="245" height="230" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="428" y="207" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Workspace Runtime</text>
  <text x="428" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">People · agents · resources</text>
  <text x="428" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Rooms · workflows · execution</text>
  <text x="428" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Policy-scoped operating boundary</text>
  <rect x="428" y="340" width="137" height="30" rx="15" fill="#e2e8f0"/>
  <text x="445" y="361" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">composable</text>
</g>

<path d="M665 275 H720" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<path d="M708 263 L722 275 L708 287" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

